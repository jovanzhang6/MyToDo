<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1280px; height:640px; overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(135deg,#eaf5ea 0%,#dcebf7 55%,#cfe3f5 100%);
    display:flex; align-items:center;
  }
  .copy { padding:0 0 0 64px; width:470px; flex:none; }
  .copy .kicker { font-size:14px; letter-spacing:4px; color:#5b7189; margin-bottom:18px; }
  .copy h1 { font-size:37px; line-height:1.35; color:#1c2b3a; font-weight:700; }
  .copy h1 em { font-style:normal; color:#3d8bd4; }
  .copy .sub { margin-top:16px; font-size:15px; color:#5b7189; line-height:1.7; }
  .copy .tags { margin-top:22px; display:flex; gap:8px; }
  .copy .tags span { font-size:12px; color:#3d8bd4; background:rgba(61,139,212,.1);
    border:1px solid rgba(61,139,212,.3); padding:4px 10px; border-radius:999px; }
  .stage { flex:1; display:flex; align-items:center; justify-content:flex-start; padding-left:24px; position:relative; height:100%; }
  .win {
    width:300px; height:520px; background:rgba(235,245,253,.62); border-radius:8px;
    border:1px solid rgba(255,255,255,.65); box-shadow:0 24px 60px rgba(60,100,160,.28);
    display:flex; flex-direction:column; overflow:hidden; backdrop-filter:blur(6px);
  }
  .win.main  { z-index:3; }
  .win.stats { z-index:2; margin-left:-14px; margin-top:48px; transform:scale(.9); transform-origin:left center; opacity:.98; }
  .tb { height:38px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; flex:none; }
  .tb .date { font-size:12.5px; font-weight:600; color:#5b7189; }
  .tb .icons { display:flex; gap:6px; color:#5b7189; font-size:11px; }
  .tb .icons i { width:18px; height:18px; border-radius:5px; background:rgba(120,150,180,.16);
    display:flex; align-items:center; justify-content:center; font-style:normal; }
  .list { flex:1; padding:2px 8px; }
  .row { display:flex; align-items:center; gap:8px; padding:8px 8px; margin-top:5px; border-radius:8px;
    background:rgba(255,255,255,.5); border:1px solid rgba(130,160,190,.18); }
  .row .cb { width:14px; height:14px; border-radius:4px; border:1.6px solid #3d8bd4; flex:none; }
  .row .cb.on { background:#3d8bd4; position:relative; }
  .row .cb.on::after { content:"✓"; position:absolute; inset:0; color:#fff; font-size:10px;
    display:flex; align-items:center; justify-content:center; }
  .row .tx { flex:1; font-size:12.5px; color:#1c2b3a; }
  .row.done { background:rgba(255,255,255,.24); border-color:rgba(130,160,190,.1); }
  .row.done .tx { color:#46586c; text-decoration:line-through; text-decoration-thickness:2px;
    text-decoration-color:#223247; opacity:.8; }
  .badge { flex:none; font-size:10.5px; padding:2px 7px; border-radius:5px;
    background:rgba(61,139,212,.14); color:#3d8bd4; }
  .badge.daily { background:rgba(61,139,212,.15); color:#3d8bd4; }
  .badge.limited { background:rgba(212,72,61,.14); color:#d4483d; font-weight:600; }
  .addbar { flex:none; padding:8px 10px 10px; border-top:1px solid rgba(255,255,255,.55); }
  .pills { display:flex; gap:6px; margin-bottom:6px; }
  .pill { font-size:11px; padding:3px 10px; border-radius:999px; color:#5b7189;
    background:rgba(255,255,255,.45); border:1px solid rgba(120,150,180,.28); }
  .pill.on { background:#3d8bd4; border-color:#3d8bd4; color:#fff; }
  .inrow { display:flex; gap:6px; }
  .inrow .ipt { flex:1; height:32px; border-radius:8px; background:rgba(255,255,255,.7);
    border:1px solid rgba(120,150,180,.35); font-size:12px; color:#8ba0b5;
    display:flex; align-items:center; padding:0 10px; }
  .inrow .go { flex:none; width:34px; border-radius:8px; background:#3d8bd4; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px; }
  /* 统计窗 */
  .sc { padding:10px 12px; display:flex; flex-direction:column; gap:8px; height:100%; }
  .card { background:rgba(255,255,255,.55); border:1px solid rgba(130,160,190,.18);
    border-radius:10px; padding:9px 11px; }
  .hero { display:flex; align-items:center; gap:12px; }
  .ring { width:52px; height:52px; border-radius:50%; flex:none; position:relative;
    background:conic-gradient(#3d8bd4 75%, rgba(120,150,180,.2) 0); display:flex;
    align-items:center; justify-content:center; }
  .ring::before { content:""; position:absolute; width:40px; height:40px; border-radius:50%;
    background:rgba(250,253,255,.95); }
  .ring b { position:relative; font-size:11px; color:#1c2b3a; }
  .ht { font-size:12px; color:#1c2b3a; font-weight:600; }
  .ht small { display:block; font-weight:400; color:#5b7189; margin-top:2px; font-size:10.5px; }
  .streak { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#5b7189; }
  .streak b { font-size:18px; color:#3d8bd4; margin-right:4px; }
  .hm { display:grid; grid-template-columns:repeat(10,1fr); gap:3px; }
  .hm i { aspect-ratio:1; border-radius:2px; background:rgba(61,139,212,.85); }
  .hm i.m { background:rgba(61,139,212,.45); }
  .hm i.e { background:rgba(120,150,180,.15); }
  .rate { display:flex; align-items:center; gap:8px; font-size:10.5px; color:#5b7189; margin-top:5px; }
  .rate .tr { flex:1; height:5px; border-radius:3px; background:rgba(120,150,180,.15); }
  .rate .tr i { display:block; height:100%; border-radius:3px; background:#3d8bd4; }
  .rate .tr i.g { background:#58a942; }
  .rate b { width:32px; text-align:right; color:#1c2b3a; }
  /* 悬浮球 */
  .ballwin { position:absolute; right:64px; bottom:70px; width:84px; height:84px; z-index:4; }
  .disc { width:100%; height:100%; border-radius:50%;
    background:linear-gradient(160deg,#6aa7dd,#3d7fc0);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 30px rgba(30,60,100,.35); position:relative; }
  .disc::before { content:""; position:absolute; inset:5px; border-radius:50%;
    background:conic-gradient(rgba(255,255,255,.92) 60%, rgba(255,255,255,.18) 0); }
  .disc .core { position:relative; width:72%; height:72%; border-radius:50%;
    background:rgba(21,48,78,.9); display:flex; flex-direction:column; align-items:center;
    justify-content:center; color:#fff; }
  .disc .core b { font-size:16px; line-height:1.1; }
  .disc .core small { font-size:8.5px; color:rgba(255,255,255,.75); }
</style>
</head>
<body>
  <div class="copy">
    <div class="kicker">MYTODO · OPEN SOURCE</div>
    <h1>再好的 TODO，<br>不如一个<em>用得下去</em>的。</h1>
    <div class="sub">常驻桌面的磨砂玻璃小组件。每日任务自动重来，<br>限时任务到期自走，完成率它来记账——你只管做事。</div>
    <div class="tags"><span>Tauri 2 + Rust</span><span>安装包 1.3 MB</span><span>28 项单测</span><span>MIT</span></div>
  </div>
  <div class="stage">
    <div class="win main">
      <div class="tb"><span class="date">9月25日 周五</span>
        <span class="icons"><i>◎</i><i>▮▮</i><i>⚙</i><i>📌</i><i>×</i></span></div>
      <div class="list">
        <div class="row"><span class="cb"></span><span class="tx">每天刷 3 道算法题</span><span class="badge daily">每日</span></div>
        <div class="row"><span class="cb"></span><span class="tx">交季度报告</span><span class="badge limited">今天到期</span></div>
        <div class="row done"><span class="cb on"></span><span class="tx">背 20 个单词</span><span class="badge daily">每日</span></div>
        <div class="row"><span class="cb"></span><span class="tx">读《设计心理学》第三章</span><span class="badge">不限时</span></div>
      </div>
      <div class="addbar">
        <div class="pills"><span class="pill on">不限时</span><span class="pill">每日</span><span class="pill">限时</span></div>
        <div class="inrow"><span class="ipt">要做点什么？回车添加</span><span class="go">✓</span></div>
      </div>
    </div>
    <div class="win stats">
      <div class="sc">
        <div class="card hero">
          <div class="ring"><b>3/4</b></div>
          <div class="ht">今日完成<small>剩余 1 件 · 加油</small></div>
        </div>
        <div class="card streak"><span><b>12</b>天 连续打卡</span><span>最长 18 天</span></div>
        <div class="card">
          <div class="hm"><i></i><i></i><i class="m"></i><i></i><i></i><i class="e"></i><i></i><i></i><i class="m"></i><i></i><i></i><i></i><i class="m"></i><i class="e"></i><i></i><i></i><i></i><i class="m"></i><i></i><i class="e"></i></div>
        </div>
        <div class="card">
          <div class="rate"><span>每日</span><div class="tr"><i style="width:75%"></i></div><b>75%</b></div>
          <div class="rate"><span>按期率</span><div class="tr"><i class="g" style="width:88%"></i></div><b>88%</b></div>
        </div>
      </div>
    </div>
    <div class="ballwin"><div class="disc"><div class="core"><b>1</b><small>待办</small></div></div></div>
  </div>
</body>
</html>
