<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyToDo</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <span id="app-title">MyToDo</span>
        <span id="tb-buttons">
          <button id="btn-stats" class="tb-btn" title="统计" aria-label="统计">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
          </button>
          <button id="btn-settings" class="tb-btn" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg>
          </button>
          <button id="btn-pin" class="tb-btn" title="置顶开关" aria-label="置顶开关">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16.5V21"/><path d="M9 3.5h6l-.8 6.8 2.8 2.9v1.8H7v-1.8l2.8-2.9L9 3.5z"/></svg>
          </button>
          <button id="btn-close" class="tb-btn" title="隐藏到托盘" aria-label="隐藏到托盘">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </span>
      </header>
      <div id="view-list" class="view">
        <main id="list" aria-live="polite"></main>
        <footer id="addbar">
          <div id="kind-row">
            <label><input type="radio" name="kind" value="open" checked /><span class="kind-name">不限时</span></label>
            <label><input type="radio" name="kind" value="daily" /><span class="kind-name">每日</span></label>
            <label><input type="radio" name="kind" value="limited" /><span class="kind-name">限时</span></label>
            <span id="due-wrap" hidden>
              <span class="due-label">截止</span>
              <input type="date" id="due-date" />
            </span>
          </div>
          <div id="input-row">
            <input id="new-task" type="text" placeholder="要做点什么？回车添加" maxlength="200" />
            <button id="btn-add" title="添加" aria-label="添加">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.4L19.5 7.2"/></svg>
            </button>
          </div>
          <div id="tip"></div>
        </footer>
      </div>

      <div id="view-stats" class="view" hidden>
        <header id="stats-header">
          <button id="btn-stats-back" class="tb-btn" title="返回清单" aria-label="返回清单">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
          </button>
          <b>统计</b>
        </header>
        <div class="stats-scroll">
          <section class="card hero-card">
            <div id="ring" class="ring"><span id="ring-num">0/0</span></div>
            <div class="hero-text">
              <b id="hero-title">今日完成</b>
              <small id="hero-sub">剩余 0 件</small>
            </div>
          </section>
          <section class="card streak-card">
            <div class="streak-big"><span id="streak-num">—</span><small>连续打卡</small></div>
            <div class="streak-side">最长纪录 <b id="streak-longest">—</b></div>
          </section>
          <section class="card">
            <h3>近 30 天</h3>
            <div id="heatmap"></div>
            <small id="heatmap-note" class="muted"></small>
          </section>
          <section class="card">
            <h3>分类完成率（今日）</h3>
            <div class="rate-row"><span>每日</span><div class="bar-track"><div id="bar-daily" class="bar-fill"></div></div><b id="rate-daily">—</b></div>
            <div class="rate-row"><span>限时</span><div class="bar-track"><div id="bar-limited" class="bar-fill"></div></div><b id="rate-limited">—</b></div>
            <div class="rate-row"><span>不限时</span><div class="bar-track"><div id="bar-open" class="bar-fill"></div></div><b id="rate-open">—</b></div>
          </section>
          <section class="card">
            <h3>任务健康</h3>
            <div class="rate-row"><span>按期完成率</span><div class="bar-track"><div id="bar-ontime" class="bar-fill ontime"></div></div><b id="rate-ontime">—</b></div>
            <div id="backlog-alert" class="backlog" hidden></div>
            <small id="health-note" class="muted"></small>
          </section>
        </div>
      </div>
      <div id="settings-pop" class="settings-pop" hidden>
        <label><span class="opt-name">不透明度</span>
          <input type="range" id="opacity-slider" min="10" max="95" step="5" value="50" />
          <span id="opacity-value" class="opacity-value">50%</span>
        </label>
        <label><span class="opt-name">到期提醒</span>
          <input type="checkbox" id="reminders-toggle" />
        </label>
      </div>
      <div id="stats-panel" class="stats-panel" hidden>
        <div class="stat-hero"><span id="stat-today">0 / 0</span><small>今日完成</small></div>
        <div class="stat-row"><span>每日任务</span><b id="stat-daily">—</b></div>
        <div class="stat-row"><span>限时任务</span><b id="stat-limited">—</b></div>
        <div class="stat-row"><span>不限时任务</span><b id="stat-open">—</b></div>
        <div class="stat-row"><span>连续打卡</span><b id="stat-streak">—</b></div>
        <div class="stat-row"><span>累计归档</span><b id="stat-archive">0</b></div>
        <div id="stat-trend"></div>
      </div>
      <div id="resize-strip-n" class="rz rz-n" data-dir="North"></div>
      <div id="resize-strip-s" class="rz rz-s" data-dir="South"></div>
      <div id="resize-strip-e" class="rz rz-e" data-dir="East"></div>
      <div id="resize-strip-w" class="rz rz-w" data-dir="West"></div>
      <div id="resize-strip-nw" class="rz rz-nw" data-dir="NorthWest"></div>
      <div id="resize-strip-ne" class="rz rz-ne" data-dir="NorthEast"></div>
      <div id="resize-strip-sw" class="rz rz-sw" data-dir="SouthWest"></div>
      <div id="resize-strip-se" class="rz rz-se" data-dir="SouthEast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
